<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Puttu ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
:root {
    --primary-pink: #ff4e8a;
    --light-pink: #ff9ec6;
    --soft-pink: #ffc2e2;
    --accent-green: #00c853;
    --accent-red: #d50000;
    --glass-bg: rgba(255, 255, 255, 0.1);
    --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, var(--primary-pink), var(--light-pink), var(--soft-pink));
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;
    position: relative;
}

/* Animated background particles */
.particle {
    position: absolute;
    width: 10px;
    height: 10px;
    background: rgba(255, 255, 255, 0.5);
    border-radius: 50%;
    animation: float 10s linear infinite;
}

@keyframes float {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}

/* Glass Card with modern twist */
.card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    padding: 40px;
    width: 90%;
    max-width: 500px;
    border-radius: 25px;
    text-align: center;
    box-shadow: var(--shadow);
    animation: slideIn 1.5s ease-out;
    border: 1px solid rgba(255, 255, 255, 0.2);
    position: relative;
    overflow: hidden;
}

.card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    animation: shimmer 3s infinite;
    pointer-events: none;
}

@keyframes shimmer {
    0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
    100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(50px) scale(0.9); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

h1 {
    font-family: 'Dancing Script', cursive;
    font-size: 32px;
    margin-bottom: 20px;
    animation: bounceIn 1s ease;
}

@keyframes bounceIn {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.05); }
    70% { transform: scale(0.9); }
    100% { transform: scale(1); opacity: 1; }
}

.question {
    font-size: 20px;
    margin: 25px 0;
    animation: fadeInText 0.5s ease;
}

@keyframes fadeInText {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

button {
    padding: 12px 28px;
    font-size: 16px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 10px;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}

button::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
    transition: left 0.5s;
}

button:hover::before {
    left: 100%;
}

.yes {
    background: var(--accent-green);
    color: white;
    box-shadow: 0 4px 15px rgba(0, 200, 83, 0.4);
}

.yes:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(0, 200, 83, 0.6);
}

.no {
    background: var(--accent-red);
    color: white;
    box-shadow: 0 4px 15px rgba(213, 0, 0, 0.4);
    position: absolute;
    animation: wiggle 1s infinite;
}

@keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
}

/* Progress bar for questions */
.progress {
    width: 100%;
    height: 5px;
    background: rgba(255, 255, 255, 0.3);
    border-radius: 5px;
    margin-bottom: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--primary-pink), var(--light-pink));
    border-radius: 5px;
    transition: width 0.5s ease;
}

/* Floating Hearts with variety */
.heart {
    position: absolute;
    font-size: 20px;
    animation: floatUp 6s linear infinite;
    opacity: 0.8;
}

@keyframes floatUp {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
    50% { opacity: 0.8; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
}

.emoji {
    position: absolute;
    font-size: 24px;
    animation: floatUp 8s linear infinite;
}

/* Final celebration */
.celebration {
    animation: confetti 2s ease-in-out infinite;
}

@keyframes confetti {
    0% { transform: scale(1); }
    50% { transform: scale(1.1) rotate(5deg); }
    100% { transform: scale(1); }
}

.hidden { display: none; }
</style>
</head>

<body>

<!-- Background Song (Varoon - Hindi song from free platform - Ad-free autoplay) -->
<audio autoplay loop>
    <source src="https://www.zapsplat.com/wp-content/uploads/2015/music/romantic_hindi_instrumental_varoon_style.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<!-- Animated Particles -->
<script>
for (let i = 0; i < 50; i++) {
    const particle = document.createElement('div');
    particle.classList.add('particle');
    particle.style.left = Math.random() * 100 + 'vw';
    particle.style.animationDelay = Math.random() * 10 + 's';
    document.body.appendChild(particle);
}
</script>

<div class="card" id="mainCard">
    <h1>💖 Puttu 💖</h1>
    <div class="progress">
        <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
    </div>
    <div class="question" id="questionText">
        Puttu me apko bhot pyaar krta hun 🥺❤️<br>
        Kya aap bhi mujhse pyaar krti ho?
    </div>
    <button class="yes" onclick="nextQuestion()">YES 😘</button>
    <button class="no" id="noBtn">NO 😏</button>
</div>

<script>
const questions = [
    "Kya aap mere saath lifetime wali love story likhogi? 📖💘",
    "Agar me aapka ho jaun officially… to mana to nahi karogi? 😌",
    "Future me matching outfits pehen ke reels banayenge? 💃🕺",
    "Har ladai ke baad bhi sirf mujhe hi choose karogi? 🥺",
    "Meri forever Valentine banogi? 💍❤️"
];

let current = 0;
const questionText = document.getElementById("questionText");
const progressBar = document.getElementById("progressBar");

function nextQuestion() {
    if (current < questions.length) {
        questionText.innerHTML = questions[current];
        current++;
        progressBar.style.width = (current / questions.length) * 100 + '%';
    } else {
        questionText.innerHTML = "<div class='celebration'>YAYYYY 😭❤️<br>Officially meri Puttu meri forever Valentine 💖<br>Happy Valentine's Day 💌</div>";
        document.querySelector(".yes").style.display = "none";
        document.querySelector(".no").style.display = "none";
        progressBar.style.width = '100%';
        // Trigger extra celebration
        for (let i = 0; i < 20; i++) {
            setTimeout(() => createEmoji(), i * 100);
        }
    }
}

/* NO button runs when clicked */
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("click", moveButton);
noBtn.addEventListener("mouseover", moveButton);

function moveButton() {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 50);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

/* Floating hearts and emojis generator */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);
    setTimeout(() => { heart.remove(); }, 6000);
}

function createEmoji() {
    const emoji = document.createElement("div");
    emoji.classList.add("emoji");
    emoji.innerHTML = ["🎉", "💕", "🌟", "🥳"][Math.floor(Math.random() * 4)];
    emoji.style.left = Math.random() * 100 + "vw";
    emoji.style.animationDuration = (Math.random() * 3 + 5) + "s";
    document.body.appendChild(emoji);
    setTimeout(() => { emoji.remove(); }, 8000);
}

setInterval(createHeart, 500);
</script>

</body>
</html>
